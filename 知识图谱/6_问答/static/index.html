<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低空经济无人机法律智能问答</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280;
    --line:#e5e7eb; --brand:#10a37f; --brand-d:#0e8e6f;
    --user:#e8f0fe; --assist:#ffffff; --chip:#f0f2f5; --warn:#b45309;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1a1c; --panel:#232326; --ink:#ececf1; --muted:#9a9aa5;
      --line:#34343a; --user:#2a3a52; --assist:#232326; --chip:#2c2c31; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:15px/1.65 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#34c9a0);
    display:grid;place-items:center;color:#fff;font-size:17px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{font-size:12px;color:var(--muted);margin-top:1px}
  header .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;display:inline-block}
  .dot.on{background:var(--brand)} .dot.off{background:#e0574b}

  main{flex:1;overflow-y:auto;padding:24px 0 8px}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}

  .empty{text-align:center;color:var(--muted);margin-top:8vh}
  .empty h2{color:var(--ink);font-weight:600;margin:0 0 6px}
  .samples{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .samples button{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left;
    max-width:340px;box-shadow:var(--shadow);transition:.15s}
  .samples button:hover{border-color:var(--brand);transform:translateY(-1px)}

  .msg{display:flex;gap:12px;margin:18px 0}
  .msg .av{width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-size:15px;color:#fff}
  .msg.user .av{background:#6b7280} .msg.assist .av{background:var(--brand)}
  .msg .body{flex:1;min-width:0}
  .msg .who{font-weight:600;font-size:13px;margin-bottom:3px}
  .bubble{background:var(--assist);border:1px solid var(--line);border-radius:12px;padding:12px 15px;
    box-shadow:var(--shadow);overflow-wrap:anywhere}
  .msg.user .bubble{background:var(--user);border-color:transparent}
  .bubble h3{font-size:15px;margin:14px 0 6px} .bubble h3:first-child{margin-top:0}
  .bubble p{margin:8px 0} .bubble ul,.bubble ol{margin:8px 0;padding-left:22px}
  .bubble li{margin:3px 0}
  .bubble strong{font-weight:650}
  .bubble .cite{color:var(--brand-d);font-weight:600;background:rgba(16,163,127,.09);
    padding:0 3px;border-radius:4px}
  .thinking{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 思考链(分析过程) */
  .reason{margin:0 0 10px;border-left:3px solid var(--line);background:rgba(107,114,128,.05);
    border-radius:0 8px 8px 0;padding:6px 12px}
  .reason>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;
    user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
  .reason>summary::-webkit-details-marker{display:none}
  .reason>summary::before{content:"▸";color:var(--brand);font-size:11px}
  .reason[open]>summary::before{content:"▾"}
  .reason-body{font-size:13px;color:var(--muted);margin-top:6px}
  .reason-body p{margin:5px 0} .reason-body ul{margin:5px 0;padding-left:20px}
  .reason-body .cite{color:var(--brand-d);font-weight:600}
  .final{overflow-wrap:anywhere}
  .reason+.final:empty::after{content:"分析中…";color:var(--muted);font-size:13px}
  .errline{color:var(--warn);font-size:13.5px;background:rgba(180,83,9,.08);
    padding:8px 12px;border-radius:8px;border:1px solid rgba(180,83,9,.25)}

  /* 来源折叠 */
  .sources{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .sources summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;user-select:none}
  .sources summary::marker{color:var(--brand)}
  .src-grp{font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  .src{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:7px 0;background:var(--panel)}
  .src .t{font-size:13px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .src .via{font-size:11.5px;color:var(--muted);font-weight:400}
  .src .body{font-size:12.5px;color:var(--muted);margin-top:4px;max-height:0;overflow:hidden;transition:.2s}
  .src.open .body{max-height:400px;overflow:auto;margin-top:6px}
  .src .t{cursor:pointer}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--chip);color:var(--muted);font-weight:500}
  .tag.cur{background:rgba(16,163,127,.12);color:var(--brand-d)}
  .tag.old{background:rgba(180,83,9,.12);color:var(--warn)}
  .tag.x{background:rgba(16,163,127,.12);color:var(--brand-d)}

  /* 输入区 */
  footer{background:var(--bg);padding:8px 0 16px;position:sticky;bottom:0}
  .opts{max-width:820px;margin:0 auto 8px;padding:0 20px;display:flex;gap:14px;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted);align-items:center}
  .opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
  .opts select{font:inherit;font-size:12.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink)}
  .composer{max-width:820px;margin:0 auto;padding:0 20px;display:flex;gap:10px;align-items:flex-end}
  .composer .box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);display:flex;align-items:flex-end;padding:6px 6px 6px 14px}
  textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);
    font:inherit;max-height:180px;padding:8px 0}
  .send{width:36px;height:36px;border:0;border-radius:9px;background:var(--brand);color:#fff;
    cursor:pointer;font-size:16px;flex:none}
  .send:disabled{background:#c7c7cc;cursor:not-allowed}
  .hint{max-width:820px;margin:6px auto 0;padding:0 20px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">🛩️</div>
  <div>
    <h1>低空经济无人机法律智能问答</h1>
    <div class="sub">GraphRAG · 向量检索 + 知识图谱 + 大模型生成</div>
  </div>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statxt">连接中…</span></div>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <div class="empty" id="empty">
      <h2>无人机法律，问我</h2>
      <div>依据 309 法规 + 648 工作文件 + 531 案例，答案带法条引用与时效标注</div>
      <div class="samples" id="samples"></div>
    </div>
  </div>
</main>

<footer>
  <div class="opts">
    <label title="hybrid=向量+关键词；sparse 免检索key"><span>模式</span>
      <select id="mode">
        <option value="hybrid">hybrid（向量+关键词）</option>
        <option value="dense">dense（向量）</option>
        <option value="sparse">sparse（关键词·免key）</option>
      </select></label>
    <label><input type="checkbox" id="rerank" checked> 精排 rerank</label>
    <label><input type="checkbox" id="expand" checked> 图谱扩展</label>
    <label><input type="checkbox" id="only_current" checked> 仅现行有效</label>
  </div>
  <div class="composer">
    <div class="box">
      <textarea id="q" rows="1" placeholder="例如：微型无人机在管制空域飞行需要满足什么条件？"></textarea>
      <button class="send" id="send" title="发送">➤</button>
    </div>
  </div>
  <div class="hint">答案由 AI 依据检索到的法规条文生成，仅供参考，不构成法律意见。</div>
</footer>

<script>
const SAMPLES = [
  "无人机在管制空域飞行需要满足什么条件？未经批准飞行会有什么处罚？",
  "微型、轻型、小型无人机是怎么划分的？重量标准分别是多少？",
  "无人机实名登记有哪些要求？不登记会怎样？",
  "无人机适航审定适用于哪些机型？",
];
const $ = s => document.querySelector(s);
const chat = $("#chat"), main = $("#main");
let busy = false;

// 示例问题
const sbox = $("#samples");
SAMPLES.forEach(s => { const b = document.createElement("button");
  b.textContent = s; b.onclick = () => { $("#q").value = s; send(); }; sbox.appendChild(b); });

// 健康检查
fetch("/api/health").then(r=>r.json()).then(h=>{
  const ok = h.generation_key;
  $("#dot").className = "dot " + (ok ? "on":"off");
  $("#statxt").textContent = ok ? `就绪 · ${h.model}` : "未配置生成密钥";
}).catch(()=>{ $("#dot").className="dot off"; $("#statxt").textContent="服务离线"; });

// textarea 自适应高度 + 回车发送
const ta = $("#q");
ta.addEventListener("input", ()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,180)+"px"; });
ta.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("#send").onclick = send;

function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// 轻量 markdown：标题/加粗/列表/法条高亮
function renderMd(t){
  const cite = s => s.replace(/(《[^》]+》(?:第[一-龥0-9]+条)?)/g, '<span class="cite">$1</span>');
  const lines = t.split("\n"); let html="", inList=false;
  const closeList = ()=>{ if(inList){ html+="</ul>"; inList=false; } };
  for(let raw of lines){
    let l = esc(raw);
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if(/^#{1,4}\s/.test(raw)){ closeList(); html+=`<h3>${cite(l.replace(/^#{1,4}\s/,""))}</h3>`; continue; }
    if(/^\s*[-*]\s+/.test(raw) || /^\s*\d+[.)、]\s+/.test(raw)){
      if(!inList){ html+="<ul>"; inList=true; }
      html += `<li>${cite(l.replace(/^\s*(?:[-*]|\d+[.)、])\s+/,""))}</li>`; continue;
    }
    closeList();
    if(l.trim()==="") html+=""; else html += `<p>${cite(l)}</p>`;
  }
  closeList(); return html;
}

// 把 "【分析】…【结论】…" 切成思考链 + 最终答案(在首个【结论】处切开)
function splitReason(raw){
  const m = /(^|\n)\s*#{0,4}\s*【\s*结\s*论\s*】/.exec(raw);
  const stripHead = s => s.replace(/^\s*#{0,4}\s*【\s*分\s*析\s*】\s*/,"");
  if(m){
    const idx = m.index + m[0].length;
    return { think: stripHead(raw.slice(0, m.index)).trim(),
             final: raw.slice(idx).trim(), hasFinal:true };
  }
  return { think: stripHead(raw).trim(), final:"", hasFinal:false };
}

// 渲染成 思考链(可折叠) + 最终答案。collapsed=true 时折叠思考块(生成完)
function renderReasoned(raw, collapsed){
  const {think, final, hasFinal} = splitReason(raw);
  // 兜底:生成结束却没出现【结论】→整段当最终答案，不显思考块，绝不丢内容
  if(collapsed && !hasFinal) return `<div class="final">${renderMd(think||raw)}</div>`;
  let h = "";
  if(think) h += `<details class="reason" ${collapsed?"":"open"}>`
    + `<summary>💭 思考过程（逐条分析法条）</summary>`
    + `<div class="reason-body">${renderMd(think)}</div></details>`;
  h += `<div class="final">${final?renderMd(final):""}</div>`;
  return h;
}

function addMsg(role, initHtml){
  $("#empty")?.remove();
  const m = document.createElement("div"); m.className = "msg "+role;
  m.innerHTML = `<div class="av">${role==="user"?"你":"AI"}</div>
    <div class="body"><div class="who">${role==="user"?"我":"法律助手"}</div>
    <div class="bubble">${initHtml||""}</div></div>`;
  chat.appendChild(m); scroll();
  return m.querySelector(".bubble");
}
function scroll(){ main.scrollTop = main.scrollHeight; }

function sourcesHtml(src){
  if(!src) return "";
  const stTag = s => s==="现行有效" ? '<span class="tag cur">现行有效</span>'
                  : s ? `<span class="tag old">${esc(s)}</span>` : "";
  let h = `<details class="sources"><summary>📎 引用来源（主命中 ${src.main.length} · 关联 ${src.linked.length}）</summary>`;
  if(src.main.length){ h += `<div class="src-grp">主要条文</div>`;
    src.main.forEach(s=>{ const title = s.type==="case" ? esc(s.head)
        : `《${esc(s.law)}》${esc(s.art||"")}`;
      h += `<div class="src"><div class="t" onclick="this.parentNode.classList.toggle('open')">
        ${title} ${stTag(s.status)} <span class="via">score ${s.score}</span></div>
        <div class="body">${esc(s.text)}</div></div>`; }); }
  if(src.linked.length){ h += `<div class="src-grp">关联条款（知识图谱扩展）</div>`;
    src.linked.forEach(s=>{ h += `<div class="src"><div class="t" onclick="this.parentNode.classList.toggle('open')">
        《${esc(s.law)}》${esc(s.art||"")} ${stTag(s.status)}
        <span class="via">${esc(s.via)}${s.seeds>1?" ·×"+s.seeds+"种子":""}</span></div>
        <div class="body">${esc(s.text)}</div></div>`; }); }
  return h + "</details>";
}

async function send(){
  const q = ta.value.trim();
  if(!q || busy) return;
  busy = true; $("#send").disabled = true;
  addMsg("user", `<p>${esc(q)}</p>`);
  ta.value=""; ta.style.height="auto";
  const bubble = addMsg("assist", `<div class="thinking"><span class="spin"></span>检索法规与图谱中…</div>`);

  const payload = {
    query:q, mode:$("#mode").value,
    rerank:$("#rerank").checked, expand:$("#expand").checked,
    only_current:$("#only_current").checked,
  };
  let answer="", srcHtml="", started=false;
  try{
    const resp = await fetch("/api/chat", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error(e.error||("HTTP "+resp.status)); }
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf="";
    while(true){
      const {value,done} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      let idx;
      while((idx = buf.indexOf("\n\n")) >= 0){
        const block = buf.slice(0,idx); buf = buf.slice(idx+2);
        const ev = /event:\s*(.+)/.exec(block), dt = /data:\s*([\s\S]+)/.exec(block);
        if(!ev||!dt) continue;
        const type = ev[1].trim(), data = JSON.parse(dt[1]);
        if(type==="meta"){
          srcHtml = sourcesHtml(data.sources);
          const badge = `${data.mode}${data.reranked?"+rerank":""}${payload.expand?"+图扩展":""}${data.only_current?"·仅现行":""}`;
          bubble.innerHTML = `<div class="thinking"><span class="spin"></span>已检索 ${data.n_main} 条主命中 + ${data.n_linked} 条关联（${badge}），生成中…</div>`;
        } else if(type==="token"){
          if(!started){ started=true; bubble.innerHTML=""; }
          answer += data.text;
          bubble.innerHTML = renderReasoned(answer, false);
          scroll();
        } else if(type==="error"){
          bubble.innerHTML = (started?renderReasoned(answer, true):"") + `<div class="errline">⚠ ${esc(data.message)}</div>`;
        } else if(type==="done"){
          bubble.innerHTML = renderReasoned(answer, true) + srcHtml;
        }
      }
      scroll();
    }
  }catch(err){
    bubble.innerHTML = `<div class="errline">⚠ 请求失败：${esc(err.message)}</div>`;
  }finally{
    busy=false; $("#send").disabled=false; ta.focus();
  }
}
</script>
</body>
</html>
