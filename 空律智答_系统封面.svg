<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <!-- 清新天空渐变背景 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf7fb"/>
      <stop offset="55%" stop-color="#f4fbf7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- 主题色渐变(青蓝→薄荷绿) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aa8c9"/>
      <stop offset="100%" stop-color="#4fc79a"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5bbfe0"/>
      <stop offset="100%" stop-color="#6fd3ab"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3aa8c9" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- 淡淡的地平线/低空意象 -->
  <path d="M0 640 Q300 600 600 630 T1200 620 L1200 800 L0 800 Z" fill="#eaf6f1" opacity="0.7"/>
  <path d="M0 690 Q400 660 700 685 T1200 675 L1200 800 L0 800 Z" fill="#e0f1ec" opacity="0.6"/>

  <!-- ========== 知识图谱网络(背景装饰,体现 GraphRAG) ========== -->
  <g stroke="#9fd8c9" stroke-width="1.6" opacity="0.55">
    <line x1="180" y1="180" x2="320" y2="120"/>
    <line x1="320" y1="120" x2="430" y2="220"/>
    <line x1="180" y1="180" x2="250" y2="300"/>
    <line x1="430" y1="220" x2="250" y2="300"/>
    <line x1="880" y1="150" x2="1000" y2="230"/>
    <line x1="1000" y1="230" x2="930" y2="340"/>
    <line x1="880" y1="150" x2="770" y2="230"/>
    <line x1="770" y1="230" x2="930" y2="340"/>
  </g>
  <g fill="#4fc79a" opacity="0.8">
    <circle cx="180" cy="180" r="7"/><circle cx="320" cy="120" r="9"/>
    <circle cx="430" cy="220" r="6"/><circle cx="250" cy="300" r="7"/>
    <circle cx="880" cy="150" r="9"/><circle cx="1000" cy="230" r="6"/>
    <circle cx="930" cy="340" r="7"/><circle cx="770" cy="230" r="6"/>
  </g>

  <!-- ========== 中央徽标圆 ========== -->
  <circle cx="600" cy="330" r="150" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="600" cy="330" r="150" fill="none" stroke="url(#brand)" stroke-width="4"/>

  <!-- 无人机(四旋翼,简约线条) -->
  <g transform="translate(600,300)" stroke="url(#brand)" stroke-width="6" stroke-linecap="round" fill="none">
    <!-- 机臂 -->
    <line x1="-58" y1="-40" x2="58" y2="40"/>
    <line x1="58" y1="-40" x2="-58" y2="40"/>
    <!-- 机身 -->
    <rect x="-20" y="-16" width="40" height="32" rx="9" fill="#eaf7fb" stroke="url(#brand)"/>
    <!-- 旋翼 -->
    <g fill="#4fc79a" stroke="none">
      <ellipse cx="-58" cy="-40" rx="26" ry="7"/>
      <ellipse cx="58" cy="-40" rx="26" ry="7"/>
      <ellipse cx="-58" cy="40" rx="26" ry="7"/>
      <ellipse cx="58" cy="40" rx="26" ry="7"/>
    </g>
    <g fill="#3aa8c9" stroke="none">
      <circle cx="-58" cy="-40" r="5"/><circle cx="58" cy="-40" r="5"/>
      <circle cx="-58" cy="40" r="5"/><circle cx="58" cy="40" r="5"/>
    </g>
  </g>

  <!-- 天平(法律,置于无人机下方) -->
  <g transform="translate(600,378)" stroke="#3aa8c9" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="0" y1="-2" x2="0" y2="34"/>
    <line x1="-44" y1="2" x2="44" y2="2"/>
    <!-- 左托盘 -->
    <path d="M-44 2 L-58 22 L-30 22 Z" fill="#eafaf4" stroke="#4fc79a"/>
    <!-- 右托盘 -->
    <path d="M44 2 L30 22 L58 22 Z" fill="#eafaf4" stroke="#4fc79a"/>
    <line x1="-20" y1="34" x2="20" y2="34"/>
    <circle cx="0" cy="-2" r="4" fill="#3aa8c9" stroke="none"/>
  </g>

  <!-- 对话气泡(智能问答) -->
  <g transform="translate(468,232)">
    <path d="M0 0 h84 a14 14 0 0 1 14 14 v40 a14 14 0 0 1 -14 14 h-58 l-20 20 v-20 h-6 a14 14 0 0 1 -14 -14 v-40 a14 14 0 0 1 14 -14 Z"
          fill="url(#brandSoft)"/>
    <g fill="#ffffff">
      <circle cx="24" cy="34" r="5"/><circle cx="46" cy="34" r="5"/><circle cx="68" cy="34" r="5"/>
    </g>
  </g>

  <!-- ========== 团队名称 ========== -->
  <text x="600" y="560" text-anchor="middle" font-size="72" font-weight="800"
        letter-spacing="14" fill="url(#brand)">空律智答</text>
  <text x="600" y="600" text-anchor="middle" font-size="22" letter-spacing="6" fill="#5a9a8f">
    KONG · LÜ · ZHI · DA</text>

  <!-- 系统全称 -->
  <text x="600" y="656" text-anchor="middle" font-size="30" font-weight="600" fill="#2f6f7e">
    低空经济无人机法律智能问答系统</text>

  <!-- 特征标签(简约胶囊) -->
  <g font-size="20" fill="#3a8b78" text-anchor="middle">
    <g>
      <rect x="352" y="694" width="150" height="40" rx="20" fill="#e7f6f0" stroke="#8fd4c2" stroke-width="1.2"/>
      <text x="427" y="720">知识图谱</text>
    </g>
    <g>
      <rect x="518" y="694" width="164" height="40" rx="20" fill="#e7f4f8" stroke="#8fcfe0" stroke-width="1.2"/>
      <text x="600" y="720">混合检索 RAG</text>
    </g>
    <g>
      <rect x="698" y="694" width="150" height="40" rx="20" fill="#e7f6f0" stroke="#8fd4c2" stroke-width="1.2"/>
      <text x="773" y="720">时效可信</text>
    </g>
  </g>

  <!-- 顶部小标识 -->
  <text x="600" y="110" text-anchor="middle" font-size="22" letter-spacing="8" fill="#7cb8ae">
    GraphRAG · 低空经济</text>
</svg>
